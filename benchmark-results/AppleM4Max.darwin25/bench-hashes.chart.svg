<text x="221.3" y="261.7" font-size="13" fill="#111827">0.78</text>
<text x="170" y="298.0" font-size="11" fill="#9a9a9a">bench-hashes 0.11.0 on 2026-10-02, BLAKE3 servil eb5e0af</text>
<text x="170" y="312.0" font-size="11" fill="#9a9a9a">each call after other work, as a program hashes between its tasks; each bar the mean over the run</text>
