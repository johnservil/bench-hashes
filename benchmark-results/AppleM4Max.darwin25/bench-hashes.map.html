function axisOf(S) {
  if (!S.axis) {
    const vals = Object.values(S.cells).flatMap(c => c.series.filter(Boolean).flat()).map(v => 1 / v);
    S.axis = [Math.log(Math.min(...vals)) - 0.1, Math.log(Math.max(...vals)) + 0.1];
  }
  return S.axis;
}
/* One chart's lines, rates (bytes over each mean time) on the section's log scale; the opened one with axes. */
function draw(S, c, w, h, axes) {
  const live = c.series.map((s, i) => s && S.shownNow[i] ? i : -1).filter(i => i >= 0);

  /* Sizes run edge to edge; separate cases sit in the middles of equal slots. */
  const x = k => n === 1 || c.cases ? L + (k + 0.5) * (w - L - R) / n : L + k * (w - L - R) / (n - 1);
  const y = v => h - B - (Math.log(v) - lo) / (hi - lo) * (h - T - B);

  /* Every chart of a section shares its scale; faint lines at each power of ten show it. */
  if (!axes) for (let e = Math.ceil(lo / Math.LN10); e <= Math.floor(hi / Math.LN10); e++) s += `<line x1="${L}" x2="${w - R}" y1="${y(10 ** e)}" y2="${y(10 ** e)}" stroke="#f1f1ef"/>`;
  if (axes) {

    }

    const mid = (T + h - B) / 2, title = `${c.unit}, higher is faster`, half = title.length * 3.1;

    s += `<path d="M10 ${mid - half - 4} V${mid - half - 18} M6.5 ${mid - half - 13} L10 ${mid - half - 18} L13.5 ${mid - half - 13}" stroke="#6b7280" stroke-width="1.3" fill="none"/>`;
    c.sizes.forEach((lab, k) => { if (n < 12 || k % 3 === 0 || k === n - 1) s += `<text x="${x(k)}" y="${h - B + 16}" font-size="11" fill="#6b7280" text-anchor="middle">${lab}</text>`; });
