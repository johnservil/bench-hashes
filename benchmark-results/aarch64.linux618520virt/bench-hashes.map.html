    shared: `<circle cx="7" cy="7" r="3" fill="${color}"/><path d="M1.5 20 a5.5 5.5 0 0 1 11 0 z" fill="${color}"/><circle cx="15.5" cy="7" r="3" fill="${color}"/><path d="M10 20 a5.5 5.5 0 0 1 11 0 z" fill="${color}"/>`,
    file: `<path d="M5 2 h8 l5 5 v13 h-13 z" fill="none" stroke="${color}" stroke-width="1.8"/><path d="M13 2 v5 h5" fill="none" stroke="${color}" stroke-width="1.5"/>`,
    tree: `<path d="M3 3 h6 l2 2 h8 v13 h-16 z" fill="none" stroke="${color}" stroke-width="1.8"/>` + r(6, 9, 10, 2) + r(6, 13, 7, 2),
    cached: r(3, 4, 16, 14) + [6, 10, 14].map(x => `<rect x="${x}" y="1" width="1.6" height="3" fill="${color}"/><rect x="${x}" y="18" width="1.6" height="3" fill="${color}"/>`).join(""),

/* A section's one rate axis: every chart of it, every contender, so a line's

function axisOf(S) {

    S.axis = [Math.log(Math.min(...vals)) - 0.1, Math.log(Math.max(...vals)) + 0.1];

}
/* One chart's lines, rates (bytes over each mean time) on the section's log scale; the opened one with axes. */
function draw(S, c, w, h, axes) {

    s += `<path d="M10 ${mid - half - 4} V${mid - half - 18} M6.5 ${mid - half - 13} L10 ${mid - half - 18} L13.5 ${mid - half - 13}" stroke="#6b7280" stroke-width="1.3" fill="none"/>`;
    c.sizes.forEach((lab, k) => { if (n < 12 || k % 3 === 0 || k === n - 1) s += `<text x="${x(k)}" y="${h - B + 16}" font-size="11" fill="#6b7280" text-anchor="middle">${lab}</text>`; });

    const pts = c.series[i].map((v, k) => [x(k), y(1 / v)]);
    s += pts.length === 1 || c.cases ? "" : `<polyline points="${pts.map(p => p.map(q => q.toFixed(1)).join(",")).join(" ")}" fill="none" stroke="${S.colors[i]}" stroke-width="${axes ? 2.2 : 1.5}"/>`;

}
function render() {
  const root = document.getElementById("sections"); root.innerHTML = "";
  SECTIONS.forEach((S, si) => {
    S.shownNow = S.shownNow || S.shown.slice(); S.dim = S.dim || new Set();
    const box = document.createElement("div");
    const esc = t => t.replace(/&/g, "&amp;").replace(/</g, "&lt;");
    const rows = S.details.map(([k, v, a]) => `<dt>${esc(k)}</dt><dd>${a ? `<a href="${esc(a)}">${esc(v)}</a>` : esc(v)}</dd>`).join("");
    box.innerHTML = `<h2>${S.title}</h2><p class="about">${esc(S.about)}</p><details class="run"><summary>About this run</summary><dl>${rows}</dl></details>`;
    const legend = document.createElement("div"); legend.className = "legend";
    S.names.forEach((nm, i) => {
      const b = document.createElement("button"); b.textContent = nm; b.style.setProperty("--c", S.colors[i]);
      if (!S.shownNow[i]) b.classList.add("off");
      b.onclick = () => { S.shownNow[i] = !S.shownNow[i]; render(); };
      legend.appendChild(b);
    });
    box.appendChild(legend);
    for (const [layer, lname, lnote] of S.layers) {
      if (S.layers.length > 1) {
        const lay = document.createElement("div");
        lay.className = "layer" + (S.dim.has("layer:" + layer) ? " dim" : "");
        lay.innerHTML = glyph(layer, 18) + lname + (lnote ? ` <span class="note">· ${lnote}</span>` : "");
        lay.onclick = () => flip(S, "layer:" + layer);
        box.appendChild(lay);
      }
      const g = document.createElement("div"); g.className = "grid"; g.style.setProperty("--cols", S.cols.length); box.appendChild(g);
      g.appendChild(document.createElement("div"));
      for (const [c, cname] of S.cols) {
        const h = document.createElement("div"); h.className = "h" + (S.dim.has("col:" + c) ? " dim" : "");
        h.innerHTML = glyph(c) + cname; h.dataset.key = "col:" + c; h.onclick = () => flip(S, "col:" + c); g.appendChild(h);
      }
      for (const [r, rname] of S.rows) {
        const h = document.createElement("div"); h.className = "h row" + (S.dim.has("row:" + r) ? " dim" : "");
        h.innerHTML = glyph(r) + `<span>${rname}</span>`; h.dataset.key = "row:" + r; h.onclick = () => flip(S, "row:" + r); g.appendChild(h);
        for (const [c] of S.cols) {
          const cell = document.createElement("div"); cell.className = "cell";
          const key = `${layer}|${r}|${c}`, q = S.cells[key];
          const off = S.dim.has("row:" + r) || S.dim.has("col:" + c) || S.dim.has("layer:" + layer);
          if (q) {
            cell.innerHTML = draw(S, q, 208, 94, false).svg + `<span class="call"><a class="doc" href="${q.doc}" target="_blank" title="${q.call}: its documentation">${q.call}</a></span>`;
            cell.querySelector("a.doc").onclick = e => e.stopPropagation();
            if (off) cell.classList.add("dim");
            cell.dataset.key = si + ":" + key;
            cell.onclick = () => open(S, g, cell, q, r, c, layer);
          } else {
            cell.classList.add("empty");

          g.appendChild(cell);
        }
      }

  });
}
function flip(S, key) { S.dim.has(key) ? S.dim.delete(key) : S.dim.add(key); render(); }
/* Opening: the chart grows from its own cell over the cells' area, the headers in view, and shrinks back into it. */
function open(S, grid, cell, q, row, col, layer) {
  const gr = grid.getBoundingClientRect(), cr = cell.getBoundingClientRect();
  const first = grid.querySelector(".cell").getBoundingClientRect();
  const X0 = first.left - gr.left, Y0 = first.top - gr.top;
  const W = Math.max(gr.width - X0, 640), H = Math.max(gr.height - Y0, 340);
  const z = document.createElement("div"); z.className = "zoom";
  const start = { left: cr.left - gr.left, top: cr.top - gr.top, width: cr.width, height: cr.height };
  const place = r => Object.assign(z.style, Object.fromEntries(Object.entries(r).map(([k, v]) => [k, v + "px"])));
  place(start); grid.appendChild(z);
  const d = draw(S, q, W, H, true);

  const ln = S.layers.length > 1 ? ", " + S.layers.find(l => l[0] === layer)[1] : "";
  z.innerHTML = d.svg + `<div class="title">${glyph(row, 16)}${glyph(col, 16)} ${rn}, ${cn}${ln}: <code><a class="doc" href="${q.doc}" target="_blank" title="its documentation">${q.call}</a></code></div><button class="close">✕ put back</button>`;
  z.querySelector("a.doc").onclick = e => e.stopPropagation();
  requestAnimationFrame(() => place({ left: X0, top: Y0, width: W, height: H }));
  const lit = [...grid.querySelectorAll(".h")].filter(h => h.dataset.key === "row:" + row || h.dataset.key === "col:" + col);
  lit.forEach(h => h.classList.add("lit"));
  const tip = document.getElementById("tip"), cur = z.querySelector(".cursor");

     pointer); a mouse's click, or the button, puts the chart back. */

    const k = d.n === 1 ? 0 : Math.max(0, Math.min(d.n - 1, Math.round((mx - d.L) / slot - (q.cases ? 0.5 : 0))));
    cur.setAttribute("x1", d.x(k)); cur.setAttribute("x2", d.x(k)); cur.setAttribute("visibility", "visible");
    const rows = q.series.map((s, i) => s && S.shownNow[i] ? [i, 1 / s[k], s[k]] : null).filter(Boolean).sort((a, b) => b[1] - a[1]);
    const time = ns => ns >= 1e6 ? (ns / 1e6).toPrecision(3) + " ms" : ns >= 1e3 ? (ns / 1e3).toPrecision(3) + " µs" : ns.toPrecision(3) + " ns";
    tip.innerHTML = `<b>${q.sizes[k]}</b><br>` + rows.map(([i, rate, t]) => `<span class="sw" style="background:${S.colors[i]}"></span>${S.names[i]}: ${rate.toPrecision(3)} ${q.unit} · ${time(t * q.per[k])} ${q.what}`).join("<br>");
    tip.style.display = "block";
    tip.style.left = Math.min(e.clientX + 14, window.innerWidth - tip.offsetWidth - 8) + "px";
    /* Above a finger, which would hide it; below a mouse pointer. */

  const onKey = e => { if (e.key === "Escape") { document.removeEventListener("keydown", onKey); close(); } };
  document.addEventListener("keydown", onKey);

}
render();
/* A link to one chart (#solo|one|lent, or #1:solo|file|cached for a later section) opens it. */
function openFromHash() {
  if (location.hash.length < 2) return;
  const want = decodeURIComponent(location.hash.slice(1)), key = want.includes(":") ? want : "0:" + want;
  const cell = document.querySelector(`.cell[data-key="${CSS.escape(key)}"]`);

openFromHash();
window.addEventListener("hashchange", openFromHash);
