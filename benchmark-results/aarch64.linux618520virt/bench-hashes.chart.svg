<text x="170" y="72" font-size="13" fill="#4b5563">BLAKE3's tree spreads one message over every core; the others use one.</text>
<text x="160" y="117.7" font-size="13" fill="#111827" text-anchor="end" font-weight="600">BLAKE3, every core</text>
<rect x="170" y="100" width="490.0" height="26" rx="3" fill="#7c3aed"/>
<text x="666.0" y="117.7" font-size="13" fill="#111827" font-weight="600">6.54</text>
<text x="160" y="153.7" font-size="13" fill="#111827" text-anchor="end" font-weight="600">BLAKE3, one core</text>
<rect x="170" y="136" width="420.3" height="26" rx="3" fill="#7c3aed"/>
<text x="596.3" y="153.7" font-size="13" fill="#111827" font-weight="600">5.61</text>
<text x="160" y="189.7" font-size="13" fill="#111827" text-anchor="end">SHA-256</text>
<rect x="170" y="172" width="230.8" height="26" rx="3" fill="#c2410c"/>
<text x="406.8" y="189.7" font-size="13" fill="#111827">3.08</text>
<text x="160" y="225.7" font-size="13" fill="#111827" text-anchor="end">SHA3-256</text>
<rect x="170" y="208" width="78.7" height="26" rx="3" fill="#db2777"/>
<text x="254.7" y="225.7" font-size="13" fill="#111827">1.05</text>
<text x="160" y="261.7" font-size="13" fill="#111827" text-anchor="end">SHA-1</text>
<rect x="170" y="244" width="58.4" height="26" rx="3" fill="#8a7a1e"/>
<text x="234.4" y="261.7" font-size="13" fill="#111827">0.78</text>
<text x="170" y="298.0" font-size="11" fill="#9a9a9a">bench-hashes 0.15.0 on 2026-10-05, BLAKE3 servil 5454196</text>
<text x="170" y="312.0" font-size="11" fill="#9a9a9a">each call after other work, as a program hashes between its tasks; each bar the mean over the run</text>
