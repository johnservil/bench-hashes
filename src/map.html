<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>How fast BLAKE3 servil runs, beside other hashes</title>
<style>
body { font: 14px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; color: #111827; margin: 24px; background: #fdfdfc; }
h1 { font-size: 20px; margin: 0 0 4px; } h2 { font-size: 17px; margin: 34px 0 6px; }
.sub { color: #6b7280; margin: 0 0 14px; max-width: 980px; }
.about { color: #6b7280; font-size: 12px; margin: 0 0 2px; }
.run { color: #9ca3af; font-size: 12px; margin: 0 0 8px; }
.run summary { cursor: pointer; width: max-content; }
.run dl { display: grid; grid-template-columns: max-content 1fr; gap: 2px 12px; margin: 6px 0 4px 14px; max-width: 980px; }
.run dt { color: #6b7280; }
.run dd { margin: 0; overflow-wrap: anywhere; }
.run a { color: inherit; }
.legend { display: flex; gap: 8px; flex-wrap: wrap; margin: 0 0 6px; }
.legend button { font: 12px inherit; border: 1px solid #d1d5db; background: #fff; border-radius: 12px; padding: 3px 10px 3px 8px; cursor: pointer; }
.legend button::before { content: ""; display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; background: var(--c); vertical-align: -1px; }
.legend button.off { opacity: .35; }
.legend button.beside::before { display: none; } .legend button.beside svg { vertical-align: 0; }
/* What the lines measure: wall-clock time, CPU time, energy; any or all. */
/* The panel and each section's names stay in view while the page scrolls:
   the panel at the top, the names of the section on screen just under it. */
.measures { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 0 0 8px; font-size: 12px; color: #6b7280;
  position: sticky; top: 0; z-index: 8; background: #fdfdfc; padding: 6px 0; }
.legend { position: sticky; top: var(--bar, 38px); z-index: 8; background: #fdfdfc; padding: 4px 0 6px; }
.measures button { font: 12px inherit; border: 1px solid #c4b5fd; background: #f5f3ff; color: #4c1d95; border-radius: 12px; padding: 3px 10px 3px 8px; cursor: pointer; }
.measures button svg { vertical-align: 0; margin-right: 5px; }
/* The view's switch stands upright: its knob up, higher lines are better
   (a rate); down, lower lines are better (a cost). Its label says so. */
.measures .switch { display: inline-flex; align-items: center; gap: 6px; background: none; border: none; padding: 0 4px; cursor: pointer; color: #4c1d95; font-weight: 600; }
.measures .switch .track { width: 18px; height: 32px; border-radius: 9px; background: #c4b5fd; position: relative; }
.measures .switch .knob { position: absolute; left: 2px; top: 2px; width: 14px; height: 14px; border-radius: 50%; background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,.25); transition: top .15s; }
.measures .switch.on .knob { top: 16px; }
.measures .switch .dir { white-space: nowrap; } .measures .switch .scale { font-weight: 400; color: #6b7280; white-space: nowrap; }
.measures button.off { background: #fff; border-color: #d1d5db; color: #6b7280; opacity: .6; }
.measures button:disabled { cursor: not-allowed; opacity: .4; }
#tip .was { color: #9ca3af; }
.layer { font-size: 13px; color: #374151; display: flex; align-items: center; gap: 6px; margin: 14px 0 4px; cursor: help; user-select: none; width: max-content; padding: 2px 6px; border-radius: 6px; position: relative; }
.layer:hover, .layer.show { background: #ede9fe; }
.grid { position: relative; display: grid; grid-template-columns: 170px 38px repeat(var(--cols), 210px); gap: 6px; width: max-content; }
.axis-cell { position: relative; }
.h { font-size: 12px; color: #4b5563; text-align: center; padding: 4px; border-radius: 6px; cursor: help; user-select: none; display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; }
.h:hover, .h.show, .h.lit { background: #ede9fe; color: #111827; }
/* A header's meaning: under it while the pointer rests on it, or after a click or tap. */
.means { display: none; position: absolute; top: 100%; left: 0; margin-top: 4px; width: 240px; z-index: 7; background: #111827; color: #fff; font-size: 12px; line-height: 1.4; text-align: left; padding: 7px 9px; border-radius: 6px; }
.h:hover .means, .h.show .means, .layer:hover .means, .layer.show .means { display: block; }
.h.row { flex-direction: row; gap: 6px; justify-content: flex-start; text-align: left; }
.cell { height: 96px; border-radius: 8px; background: #fff; border: 1px solid #e5e7eb; position: relative; cursor: zoom-in; transition: opacity .15s; }
.cell.empty { background: #fafaf9; border-color: #f1f1ef; cursor: default; }
.cell .note { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 11px; color: #9ca3af; text-align: center; padding: 6px; }
.cell .call { position: absolute; left: 6px; bottom: 3px; font: 10px ui-monospace, Menlo, monospace; color: #6b7280; }
a.doc { color: inherit; text-decoration: underline dotted #9ca3af; text-underline-offset: 2px; } a.doc:hover { color: #6d28d9; text-decoration-color: #6d28d9; }
.zoom { position: absolute; background: #fff; border: 1px solid #c4b5fd; border-radius: 10px; box-shadow: 0 8px 30px rgba(0,0,0,.12); z-index: 5; overflow: hidden; transition: left .2s, top .2s, width .2s, height .2s; cursor: zoom-out; }
.zoom .title { position: absolute; left: 14px; top: 10px; font-size: 13px; color: #374151; display: flex; gap: 6px; align-items: center; }
.zoom .close { position: absolute; right: 8px; top: 6px; font-size: 12px; color: #4b5563; background: #f3f4f6; border: 1px solid #e5e7eb; border-radius: 12px; padding: 3px 10px; cursor: pointer; }
/* An opened chart's contenders: a line each, its toggle. */
.zoom .key { position: absolute; right: 10px; display: flex; flex-wrap: wrap; gap: 2px 14px; }
.zoom .key button { font: 600 12px inherit; line-height: 20px; border: none; background: none; padding: 0 4px; margin: 0; cursor: pointer; color: var(--c); border-radius: 4px; }
.zoom .key button:hover { background: #f5f3ff; }
.zoom .key button.off { opacity: .35; text-decoration: line-through; }
/* A narrow screen (a phone): the grid scales to the screen's width, and a
   chart opens as a panel across it, at full size, under the bar. */
@media (max-width: 999px) { body { margin: 10px; } .sub { font-size: 13px; } }
.zoom.phone { position: fixed; z-index: 9; }
/* The values under the pointer: as tall as they need, never wider than the window. */
#tip { position: fixed; pointer-events: none; background: #111827; color: #fff; font-size: 12px; padding: 6px 8px; border-radius: 6px; display: none; z-index: 10; box-sizing: border-box; max-width: min(34em, calc(100vw - 8px)); }
#tip .row { padding-left: 1.2em; text-indent: -1.2em; }
#tip .sw { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 5px; }
/* After the rules above, which it narrows for a phone. */
@media (max-width: 999px) { .zoom.phone .title { right: 44px; font-size: 12px; line-height: 1.35; } .zoom.phone .close .word { display: none; } }
</style></head><body>
<h1>How fast BLAKE3 servil runs, beside other hashes</h1>
<p class="sub">Each small chart is one measurement: its row is what a program hashes, its column how it calls; point at either name for what it means. Open a chart to read its values; its names hide or show their lines.</p>
<div id="sections"></div>
<div id="tip"></div>
<script>
const SECTIONS = @SECTIONS@;
function glyph(kind, size = 20, color = "#4b5563") {
  const r = (x, y, w, h, o = 1) => `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="1.2" fill="${color}" opacity="${o}"/>`;
  const g = {
    one: r(2, 8, 18, 6),
    batch: [0, 1, 2].map(j => r(7, 2 + j * 6.5, 8, 5)).join(""),
    many: [0, 1, 2].map(j => r(1 + j * 2, 3 + j * 6, 8 + (j % 2) * 6, 4)).join(""),
    coll: [[1, 3, 6], [9, 3, 11], [1, 10, 14], [17, 10, 4], [1, 17, 9], [12, 17, 9]].map(([x, y, w]) => r(x, y, w, 4)).join(""),
    merkle: `<path d="M11 4 L6 10 M11 4 L16 10 M6 10 L3.5 16 M6 10 L8.5 16 M16 10 L13.5 16 M16 10 L18.5 16" stroke="${color}" stroke-width="1.4" fill="none"/><circle cx="11" cy="3.5" r="2.2" fill="${color}"/><circle cx="6" cy="10" r="1.8" fill="${color}"/><circle cx="16" cy="10" r="1.8" fill="${color}"/>` + [1.5, 6.5, 11.5, 16.5].map(x => r(x, 16, 4, 4)).join(""),
    outb: r(1, 15, 20, 5) + `<path d="M11 13 V9 M5 13 V10 H17 V13 M11 9 V4" stroke="${color}" stroke-width="1.6" fill="none"/>` + `<circle cx="11" cy="3.5" r="2.2" fill="${color}"/>`,
    busy: `<circle cx="11" cy="11" r="4" fill="none" stroke="${color}" stroke-width="2.5"/>` + [0, 45, 90, 135, 180, 225, 270, 315].map(a => `<rect x="10" y="2" width="2" height="4" fill="${color}" transform="rotate(${a} 11 11)"/>`).join(""),
    idle: `<path d="M14 3 a8 8 0 1 0 5 13 a6.5 6.5 0 1 1 -5 -13 z" fill="${color}"/>`,
    lent: r(1, 7, 7, 8) + `<path d="M10 11 h6 M14 11 l-2.5 -2.5 M14 11 l-2.5 2.5" stroke="${color}" stroke-width="1.8" fill="none" stroke-linecap="round"/><rect x="17" y="7" width="4" height="8" rx="1" fill="none" stroke="${color}" stroke-width="1.5"/>`,
    piped: [0, 1, 2].map(j => r(1 + j * 7, 8, 5.5, 6, 1 - j * .3)).join("") + `<path d="M2 18 h18 m-3 -2.5 l3 2.5 l-3 2.5" stroke="${color}" stroke-width="1.5" fill="none" stroke-linecap="round"/>`,
    solo: `<circle cx="11" cy="6" r="3.5" fill="${color}"/><path d="M4.5 20 a6.5 6.5 0 0 1 13 0 z" fill="${color}"/>`,
    shared: `<circle cx="7" cy="7" r="3" fill="${color}"/><path d="M1.5 20 a5.5 5.5 0 0 1 11 0 z" fill="${color}"/><circle cx="15.5" cy="7" r="3" fill="${color}"/><path d="M10 20 a5.5 5.5 0 0 1 11 0 z" fill="${color}"/>`,
    file: `<path d="M5 2 h8 l5 5 v13 h-13 z" fill="none" stroke="${color}" stroke-width="1.8"/><path d="M13 2 v5 h5" fill="none" stroke="${color}" stroke-width="1.5"/>`,
    tree: `<path d="M3 3 h6 l2 2 h8 v13 h-16 z" fill="none" stroke="${color}" stroke-width="1.8"/>` + r(6, 9, 10, 2) + r(6, 13, 7, 2),
    cached: r(3, 4, 16, 14) + [6, 10, 14].map(x => `<rect x="${x}" y="1" width="1.6" height="3" fill="${color}"/><rect x="${x}" y="18" width="1.6" height="3" fill="${color}"/>`).join(""),
    storage: `<ellipse cx="11" cy="5" rx="8" ry="3" fill="none" stroke="${color}" stroke-width="1.8"/><path d="M3 5 v12 a8 3 0 0 0 16 0 v-12" fill="none" stroke="${color}" stroke-width="1.8"/>`,
  }[kind] || "";
  return `<svg width="${size}" height="${size}" viewBox="0 0 22 22">${g}</svg>`;
}
/* One rate axis for the whole page: every chart of every section, every
   contender and measure, so a line's height reads the same everywhere,
   whatever is set aside, and one chart's level compares with another's. */
let AXIS = null;
function axisOf() {
  if (!AXIS) {
    /* Over the measures shown: a hidden one (energy's joules) would stretch the scale. */
    const lines = c => [].concat(MEASURES.wall ? c.series.concat(c.before) : [], MEASURES.cpu ? c.cpu : [], MEASURES.energy ? c.energy : []);
    const vals = SECTIONS.flatMap(S => Object.values(S.cells).flatMap(c => lines(c).filter(Boolean).flat())).filter(v => v).map(shown);
    AXIS = [Math.log(Math.min(...vals)) - 0.1, Math.log(Math.max(...vals)) + 0.1];
  }
  return AXIS;
}
/* A row's shared axis: the page's one scale at the cards' height, its
   powers of ten named once for the row (each card's faint lines meet them). */
function rowAxis() {
  const [lo, hi] = axisOf(), h = 94, T = 8, B = 14;
  const y = v => h - B - (Math.log(v) - lo) / (hi - lo) * (h - T - B);
  let s = `<svg width="38" height="${h}">`;
  for (let e = Math.ceil(lo / Math.LN10); e <= Math.floor(hi / Math.LN10); e++) {
    s += `<line x1="32" x2="38" y1="${y(10 ** e)}" y2="${y(10 ** e)}" stroke="#d6d2cb"/>`;
    s += `<text x="30" y="${y(10 ** e) + 3}" font-size="9.5" fill="#4b5563" text-anchor="end">${+(10 ** e).toPrecision(1)}</text>`;
  }
  return s + "</svg>";
}
/* One chart's lines, rates (bytes over each mean time) on the section's log scale; the opened one with axes. */
/* How many times one figure is another, in plain digits to two significant
   figures: ×1.5, ×15, ×150, ×1,500 (toPrecision alone writes ×1.5e+2 from
   100 up, which readers took for 1,500). */
function timesText(r) {
  return "×" + Number(r.toPrecision(2)).toLocaleString("en-US", { maximumFractionDigits: 1 });
}
/* A span's label at point k of chart c, the worst line shown over the best
   (null below ×1.15, where none is drawn). */
function spanText(c, live, k) {
  const vs = live.map(i => c.series[i][k]).filter(Boolean);
  if (vs.length < 2) return null;
  const r = Math.max(...vs) / Math.min(...vs);
  return r >= 1.15 ? timesText(r) : null;
}
/* The right margin a chart's last span label needs: the bracket's offset,
   the gap, and the label at about 0.62 em a character (bold digits), so a
   long one (×1,500) is never cut off at the chart's edge. */
function spanRoom(c, live, axes) {
  const label = spanText(c, live, c.sizes.length - 1);
  return label ? (axes ? 12 : 8) + 3 + Math.ceil(label.length * (axes ? 12 : 10) * 0.62) + 4 : 0;
}
function draw(S, c, w, h, axes) {
  const live = c.series.map((s, i) => s && S.shownNow[i] ? i : -1).filter(i => i >= 0);
  const [lo, hi] = axisOf();
  /* An opened chart names its contenders above the plot, the names its
     toggles (open() places them), a phone's title taking two lines and two
     names to a row; case labels may take two lines below it. */
  const listed = axes ? c.series.filter(Boolean).length : 0;
  const tall = axes && narrow(), top = tall ? 72 : 40;
  const n = c.sizes.length, L = axes ? (tall ? 50 : 70) : 8, R = Math.max(axes ? 52 : 34, spanRoom(c, live, axes)), T = axes ? top + 22 * Math.ceil(listed / (tall ? 2 : 5)) + 8 : 8, B = axes ? (c.cases ? 84 : 62) : 14;
  /* Sizes run edge to edge; separate cases sit in the middles of equal slots. */
  const x = k => n === 1 || c.cases ? L + (k + 0.5) * (w - L - R) / n : L + k * (w - L - R) / (n - 1);
  const y = v => h - B - (Math.log(v) - lo) / (hi - lo) * (h - T - B);
  let s = `<svg width="${w}" height="${h}">`;
  /* Every chart shares the page's log scale: faint lines at each power of
     ten, labelled small, show it in equal steps per factor of ten. */
  if (!axes) for (let e = Math.ceil(lo / Math.LN10); e <= Math.floor(hi / Math.LN10); e++) {
    s += `<line x1="0" x2="${w}" y1="${y(10 ** e)}" y2="${y(10 ** e)}" stroke="#e7e5e0"/>`;
  }
  if (axes) {
    for (let e = Math.floor(Math.log10(Math.exp(lo))) - 1; e <= Math.ceil(Math.log10(Math.exp(hi))); e++) for (const m of [1, 2, 5]) {
      const v = m * 10 ** e; if (Math.log(v) < lo || Math.log(v) > hi) continue;
      const onNow = ["wall", "cpu", "energy"].filter(m => MEASURES[m]);
      const unit = onNow.length === 1 && onNow[0] === "wall" ? (SHOW.cost ? " ns/B" : " GB/s") : "";
      s += `<line x1="${L}" x2="${w - R}" y1="${y(v)}" y2="${y(v)}" stroke="#f3f4f6"/><text x="${L - 6}" y="${y(v) + 4}" font-size="11" fill="#6b7280" text-anchor="end">${+v.toPrecision(2)}${unit}</text>`;
    }
    /* The title runs up the axis; its arrow, beside its end, points up, as faster lines lie. */
    /* The axis names every selected measure: solid, dotted, dashed. */
    /* The unit of every measure shown, in one short phrase (the chips say which line is which). */
    const M = MEASURES, on = ["wall", "cpu", "energy"].filter(m => M[m]);
    const title0 = on.length === 1 && on[0] === "wall" && !SHOW.cost ? "gigibytes per second"
      : SHOW.cost ? on.map(m => ({ wall: "ns", cpu: "CPU ns", energy: "nJ" })[m]).join(" / ") + " per byte" : "GB per " + on.map(m => ({ wall: "second", cpu: "CPU second", energy: "joule" })[m]).join(" / ");
    const mid = (T + h - B) / 2, title = `${title0} (log scale), ${SHOW.cost ? "lower" : "higher"} is better`, half = title.length * 3.1;
    s += `<text x="14" y="${mid}" font-size="11" fill="#6b7280" transform="rotate(-90 14 ${mid})" text-anchor="middle">${title}</text>`;
    s += SHOW.cost
      ? `<path d="M10 ${mid + half + 4} V${mid + half + 18} M6.5 ${mid + half + 13} L10 ${mid + half + 18} L13.5 ${mid + half + 13}" stroke="#6b7280" stroke-width="1.3" fill="none"/>`
      : `<path d="M10 ${mid - half - 4} V${mid - half - 18} M6.5 ${mid - half - 13} L10 ${mid - half - 18} L13.5 ${mid - half - 13}" stroke="#6b7280" stroke-width="1.3" fill="none"/>`;
    /* As many size labels as fit, about 48 px each. */
    const every = Math.max(1, Math.ceil(n * 48 / (w - L - R)));
    /* Case labels wrap to the width of their slot, so neighbours never overlap. */
    const slot = (w - L - R) / Math.max(n, 1), chars = Math.max(6, Math.floor(slot / 6.2));
    const wrap = lab => lab.split(" ").reduce((lines, word) => { const last = lines[lines.length - 1]; if (last && (last + " " + word).length <= chars) lines[lines.length - 1] = last + " " + word; else lines.push(word); return lines; }, []);
    s += `<text x="${(L + w - R) / 2}" y="${h - 8}" font-size="11" fill="#6b7280" text-anchor="middle">${c.axis} (log scale)</text>`;
    c.sizes.forEach((lab, k) => { if (c.cases || k % every === 0 || k === n - 1) s += `<text x="${x(k)}" y="${h - B + 16}" font-size="11" fill="#6b7280" text-anchor="middle">${(c.cases ? wrap(lab) : [lab]).map((t, j) => `<tspan x="${x(k)}" dy="${j ? 13 : 0}">${t}</tspan>`).join("")}</text>`; });
    s += `<line class="cursor" x1="0" x2="0" y1="${T}" y2="${h - B}" stroke="#9ca3af" stroke-dasharray="3 3" visibility="hidden"/>`;
  }
  /* An earlier run beside this one: its lines dashed and pale, under the run's own. */
  if (S.besideNow) for (const i of live) {
    const was = c.before[i]; if (!was) continue;
    const pts = was.map((v, k) => v ? [x(k), y(shown(v))] : null);
    if (!(pts.filter(Boolean).length === 1 || c.cases)) {
      let run = [];
      for (const p of pts.concat([null])) {
        if (p) { run.push(p); continue; }
        if (run.length > 1) s += `<polyline points="${run.map(p => p.map(q => q.toFixed(1)).join(",")).join(" ")}" fill="none" stroke="${S.colors[i]}" stroke-opacity=".55" stroke-dasharray="4 3" stroke-width="${axes ? 2 : 1.3}"/>`;
        run = [];
      }
    }
    if (pts.length <= 3 || c.cases) s += pts.filter(Boolean).map(p => `<circle cx="${p[0]}" cy="${p[1]}" r="${axes ? 5 : 3}" fill="none" stroke="${S.colors[i]}" stroke-opacity=".7" stroke-width="1.5"/>`).join("");
  }
  /* CPU time (the processor time a unit took, all the program's threads)
     dotted; energy (the CPU package's, a unit's share) dashed. */
  for (const [m, dash, cap] of [["cpu", `0.1 ${axes ? 4 : 3}`, "round"], ["energy", axes ? "7 4" : "5 3", "butt"]]) if (MEASURES[m]) for (const i of live) {
    const line = c[m][i]; if (!line) continue;
    const pts = line.map((v, k) => v ? [x(k), y(shown(v))] : null);
    let run = [];
    for (const p of pts.concat([null])) {
      if (p) { run.push(p); continue; }
      if (run.length > 1 && !c.cases) s += `<polyline points="${run.map(p => p.map(q => q.toFixed(1)).join(",")).join(" ")}" fill="none" stroke="${S.colors[i]}" stroke-dasharray="${dash}" stroke-linecap="${cap}" stroke-width="${axes ? (m === "cpu" ? 2.6 : 2) : (m === "cpu" ? 1.8 : 1.4)}"/>`;
      run = [];
    }
    if (pts.length <= 3 || c.cases) s += pts.filter(Boolean).map(p => `<circle cx="${p[0]}" cy="${p[1]}" r="${axes ? 4 : 2.5}" fill="#fff" stroke="${S.colors[i]}" stroke-width="1.6" stroke-dasharray="${m === "cpu" ? "1.5 1.5" : "3 1.5"}"/>`).join("");
  }
  /* Dots after every line, the fastest at each point drawn last, on top:
     where two overlap, the faster one shows. */
  const dots = [];
  if (MEASURES.wall) for (const i of live) {
    const pts = c.series[i].map((v, k) => [x(k), y(shown(v))]);
    s += pts.length === 1 || c.cases ? "" : `<polyline points="${pts.map(p => p.map(q => q.toFixed(1)).join(",")).join(" ")}" fill="none" stroke="${S.colors[i]}" stroke-width="${axes ? 2.2 : 1.5}"/>`;
    if (pts.length <= 3 || c.cases) dots.push(...pts.map((p, k) => [1 / c.series[i][k], `<circle cx="${p[0]}" cy="${p[1]}" r="${axes ? 5 : 3}" fill="${S.colors[i]}"/>`]));
  }
  /* Slowest first, fastest last: where dots overlap, the fastest shows. */
  s += dots.sort((a, b) => a[0] - b[0]).map(d => d[1]).join("");
  /* A small chart's span: at its last point, a bracket from the worst line
     shown to the best, and how many times better the best is. */
  /* The span, worst line shown to best, as a bracket: at a chart's last
     point, and in an opened chart of separate cases at every case. */
  if (MEASURES.wall) {
    const at = axes && c.cases ? [...Array(n).keys()] : [n - 1];
    for (const k of at) {
      const label = spanText(c, live, k);
      if (!label) continue;
      const vs = live.map(i => c.series[i][k]).filter(Boolean);
      const best = Math.min(...vs), worst = Math.max(...vs), y1 = y(shown(best)), y2 = y(shown(worst));
      const bx = x(k) + (axes ? 12 : 8), fs = axes ? 12 : 10;
      s += `<path d="M${bx - 3} ${y1} H${bx} V${y2} H${bx - 3}" fill="none" stroke="#6b7280" stroke-width="1"/><text x="${bx + 3}" y="${(y1 + y2) / 2 + fs / 3}" font-size="${fs}" font-weight="700" fill="#4c1d95">${label}</text>`;

  }
