[package]
name = "bench-hashes"
version = "0.18.3+7e002a05faed6b9de63faf0cc2e4c188c5abc1e8"
edition = "2021"
rust-version = "1.88"
build = "build.rs"

[dependencies]
# The `rayon` feature adds Hasher::update_rayon for the BLAKE3 mt contender;
# blake3::hash and every other API stay single-threaded with it on.
[dependencies.blake3]
version = "1"
default-features = false
features = ["std", "rayon"]

# Seeded hashing for every map (crate::Map): runs lay out alike.
[dependencies.wyhash]
version = "0.6"

# Machine metadata does not need sysinfo's multithread feature.
[dependencies.sysinfo]
version = "0.30"
default-features = false

# sha2 0.11 carries its own hardware backends (ARMv8 SHA-256 instructions,
# x86 SHA-NI) with runtime detection, on every target.
[dependencies.sha2]
version = "0.11"
default-features = false

# SHA3-256: keccak 0.2 detects the ARMv8 SHA-3 instructions at run time.
[dependencies.sha3]
version = "0.11"
default-features = false

# SHA-256 through BoringSSL's assembly (OpenSSL lineage), which pipelines
# the next block's message schedule under the current block's rounds.
[dependencies.ring]
version = "0.17"
default-features = false

# BLAKE3 servil, and the one place clocks are read (the fork's clocks/
# crate: wall time, and the thread's counts per core kind). Each pin names
# its full commit hash: the contender's code, and the instrument's clocks.
# build-against replaces the contender and keeps the instrument pinned.
# To measure a local checkout of the fork instead, build with
# `bench-hashes build-against DIR` and run the executable it prints
# (CONTRIBUTING.md); pass `--expect-servil COMMIT` to
# have the run refuse any other servil. Not a bare `--config` patch: Cargo
# applies a patch only at a version the lock allows, and otherwise builds
# this pin with a warning (0.3.0 here; the fork's 0.8 releases are 0.8.x).
# build-against updates its own lock for the patch first.
[dependencies.blake3-servil]
git = "https://github.com/johnservil/BLAKE3"
rev = "d34af7413177284655b95cb718a1a306a2d15ccd"
default-features = false
features = ["std"]

[dependencies.clocks]
git = "https://github.com/johnservil/BLAKE3"
rev = "c7cb21d345fb870d6a54637b211c8760fdb345fd"

# SHA-1 with collision detection (the SHA-1DC construction git uses), pure
# Rust; there is no hardware path for the detection.
[dependencies.sha1-checked]
version = "0.10"

[features]
# Diagnostics only, never measurement configurations (src/diag_alloc.rs):
# global allocators that place the bench's buffers within a cache line.
diag-align64 = []
# Needs BENCH_DIAG_LINE_OFFSET=16, 32 or 48 at build time.
diag-line-offset = []

[build-dependencies]
# Used to fingerprint a dirty benchmark working tree.
[build-dependencies.blake3]
version = "1"
default-features = false
features = ["std"]

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
incremental = false
